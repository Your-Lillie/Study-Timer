<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>学習タイマー</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
    .container{max-width:720px;margin:0 auto;padding:2rem 1rem}

    /* AUTH SCREEN */
    .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
    .auth-box{background:#fff;border-radius:16px;border:0.5px solid #ddd;padding:2rem;width:100%;max-width:400px}
    .auth-box h1{font-size:22px;font-weight:500;margin-bottom:4px}
    .auth-box p{font-size:14px;color:#666;margin-bottom:1.5rem}
    .auth-tabs{display:flex;margin-bottom:1.5rem;gap:12px;border-bottom:1px solid #eee;padding-bottom:12px}
    .auth-tab{background:none;border:none;font-size:15px;color:#999;cursor:pointer;padding-bottom:4px;border-bottom:2px solid transparent}
    .auth-tab.active{color:#1a1a1a;border-color:#1a1a1a;font-weight:500}
    .auth-form{display:flex;flex-direction:column;gap:12px}
    .auth-form input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
    .auth-form button{background:#1a1a1a;color:#fff;border:none;padding:11px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500}
    .auth-form button:hover{background:#333}
    .guest-btn{background:none;border:none;color:#666;text-decoration:underline;cursor:pointer;font-size:13px;align-self:center;margin-top:4px}

    /* APP LAYOUT */
    .app-screen{display:none;flex-direction:column;min-height:100vh}
    .app-header{padding:1rem;border-bottom:0.5px solid #ddd;display:flex;justify-content:between;align-items:center;background:#fff;font-size:14px}
    .app-header-left{display:flex;align-items:center;gap:8px}
    .sync-btn{background:none;border:none;cursor:pointer;color:#555;display:flex;align-items:center}
    .sync-btn:hover{color:#1a1a1a}

    /* THEME TOGGLE BUTTON */
    .theme-toggle-btn{background:none;border:none;cursor:pointer;color:#555;display:flex;align-items:center;font-size:18px;padding:4px}
    .theme-toggle-btn:hover{color:#1a1a1a}

    /* CARD STYLE */
    .card{background:#fff;border-radius:16px;border:0.5px solid #ddd;padding:1.5rem;margin-bottom:1rem}
    .card-title{font-size:14px;color:#666;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:1rem;display:flex;align-items:center;gap:6px}

    /* TIMER VIEW */
    .timer-display{font-size:64px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:1.5rem 0;font-family:monospace}
    .timer-controls{display:flex;justify-content:center;gap:16px;margin-bottom:1rem}
    .btn-circle{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all 0.2s}
    .btn-primary{background:#1a1a1a;color:#fff}
    .btn-primary:hover{background:#333}
    .btn-secondary{background:#f0f0f2;color:#1a1a1a}
    .btn-secondary:hover{background:#e2e2e5}
    .timer-setup{display:flex;gap:8px;margin-top:1rem;align-items:center}
    .timer-setup select,.timer-setup input{padding:6px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
    .timer-setup select{flex:1}

    /* GRAPHS / STATS */
    .stats-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
    .stat-box{background:#f9f9fb;border-radius:12px;padding:12px;border:0.5px solid #eee}
    .stat-val{font-size:18px;font-weight:600;margin-top:4px}
    .bar-chart{display:flex;align-items:flex-end;height:120px;gap:8px;padding-top:1rem;border-bottom:1px solid #ddd;margin-bottom:4px}
    .bar-wrapper{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
    .bar{width:100%;background:#e2e2e5;border-radius:4px 4px 0 0;transition:height 0.3s;min-height:2px}
    .bar.active{background:#1a1a1a}
    .bar-label{font-size:10px;color:#888;margin-top:4px;text-align:center;white-space:nowrap}

    /* MUSIC PLAYER */
    .player-ui{display:flex;flex-direction:column;gap:10px}
    .audio-input-row{display:flex;gap:8px}
    .audio-input-row input{flex:1;padding:6px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px}
    .audio-input-row button{padding:6px 12px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px}
    .player-controls{display:flex;align-items:center;gap:12px}
    .track-info{font-size:12px;color:#666;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;flex:1}

    /* PET GAMIFICATION */
    .pet-area{display:flex;align-items:center;gap:1rem}
    .pet-avatar{width:72px;height:72px;border-radius:50%;background:#f0f0f2;display:flex;align-items:center;justify-content:center;font-size:36px;border:1px solid #e2e2e5}
    .pet-info{flex:1}
    .pet-name{font-weight:600;font-size:16px;margin-bottom:2px}
    .pet-level{font-size:12px;color:#666}
    .progress-bar-bg{width:100%;background:#f0f0f2;height:6px;border-radius:3px;margin-top:6px;overflow:hidden}
    .progress-bar-fill{background:#1a1a1a;height:100%;width:0%;transition:width 0.3s}
    .gacha-btn{padding:8px 16px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
    .gacha-btn:disabled{background:#ccc;cursor:not-allowed}

    /* LEADERBOARD & MYCARD */
    .ranking-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
    .ranking-item{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:0.5px solid #eee}
    .ranking-item.me{font-weight:bold;color:#000}
    .ranking-setup{display:none;margin-top:1rem;border-top:1px dashed #ddd;padding-top:1rem}
    .ranking-setup-row{display:flex;gap:8px}
    .ranking-setup-row input{flex:1;padding:6px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px}
    .ranking-setup-row button{padding:6px 12px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px}

    /* MODAL OVERLAY (GACHA/NOTICE) */
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;padding:1rem;z-index:99}
    .modal-box{background:#fff;border-radius:16px;padding:2rem;max-width:360px;width:100%;text-align:center}
    .modal-title{font-size:18px;font-weight:600;margin-bottom:8px}
    .modal-body{font-size:14px;color:#444;margin-bottom:1.5rem}
    .modal-close{padding:8px 24px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}

    /* DARK MODE OVERRIDES */
    body.dark{background:#1
