<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>学習タイマー</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
    .container{max-width:720px;margin:0 auto;padding:2rem 1rem}

    /* AUTH SCREEN */
    .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
    .auth-box{background:#fff;border-radius:16px;border:0.5px solid #ddd;padding:2rem;width:100%;max-width:400px}
    .auth-box h1{font-size:22px;font-weight:500;margin-bottom:4px}
    .auth-box p{font-size:14px;color:#666;margin-bottom:1.5rem}
    .auth-tabs{display:flex;margin-bottom:1.5rem;border:0.5px solid #ddd;border-radius:8px;overflow:hidden}
    .auth-tab{flex:1;padding:8px;font-size:14px;background:none;border:none;cursor:pointer;color:#888}
    .auth-tab.active{background:#1a1a1a;color:#fff}
    .auth-field{margin-bottom:12px}
    .auth-field label{font-size:13px;color:#666;display:block;margin-bottom:4px}
    .auth-field input{width:100%;padding:10px 12px;border:0.5px solid #ccc;border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a}
    .auth-btn{width:100%;padding:10px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:500;margin-top:4px}
    .auth-btn:hover{opacity:.85}
    .auth-btn.secondary{background:#f0f0f0;color:#1a1a1a;margin-top:8px}
    .auth-error{font-size:13px;color:#e74c3c;margin-top:8px;text-align:center;display:none}
    .auth-loading{text-align:center;color:#888;font-size:14px;padding:1rem}

    /* MAIN APP */
    .main-app{display:none}
    .header{margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .header-left h1{font-size:20px;font-weight:500}
    .header-left p{font-size:13px;color:#666;margin-top:2px}
    .header-right{display:flex;align-items:center;gap:8px}
    .header-pt{display:flex;align-items:center;gap:5px;background:#fff3cd;border:0.5px solid #ffc107;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:500;color:#856404}
    .header-user{font-size:12px;color:#888;display:flex;align-items:center;gap:4px}
    .logout-btn{font-size:12px;padding:4px 10px;border:0.5px solid #ddd;border-radius:6px;background:none;cursor:pointer;color:#888}
    .logout-btn:hover{background:#f0f0f0}
    .sync-btn{font-size:12px;padding:4px 10px;border:0.5px solid #185FA5;border-radius:6px;background:none;cursor:pointer;color:#185FA5;display:flex;align-items:center;gap:4px}
    .sync-btn:hover{background:#f0f6ff}
    .sync-btn.syncing{opacity:.5;pointer-events:none}

    .tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:0.5px solid #ddd;overflow-x:auto}
    .tab{font-size:13px;padding:8px 11px;background:none;border:none;color:#888;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap}
    .tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a;font-weight:500}
    .panel{display:none}.panel.active{display:block}

    .subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:1.5rem}
    .subject-card{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1rem 1.25rem;cursor:pointer;transition:border-color .15s}
    .subject-card:hover{border-color:#aaa}
    .subject-card.active{border:2px solid #185FA5}
    .subject-icon{font-size:20px;margin-bottom:8px;color:#888}
    .subject-name{font-size:14px;font-weight:500;margin-bottom:4px}
    .subject-today{font-size:13px;color:#888}

    .timer-display{background:#ebebeb;border-radius:12px;padding:2rem;text-align:center;margin-bottom:1.5rem}
    .timer-subject{font-size:14px;color:#666;margin-bottom:8px}
    .timer-time{font-size:48px;font-weight:500;letter-spacing:2px;font-variant-numeric:tabular-nums}
    .timer-controls{display:flex;gap:8px;justify-content:center;margin-top:1rem}
    .timer-btn{padding:8px 20px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
    .timer-btn:hover{background:#f0f0f0}
    .timer-btn.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
    .timer-btn.primary:hover{opacity:.85}
    .pt-earn-preview{margin-top:10px;font-size:13px;color:#856404;background:#fff3cd;border-radius:8px;padding:6px 12px;display:inline-block}

    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
    .stat-card{background:#ebebeb;border-radius:8px;padding:1rem}
    .stat-label{font-size:13px;color:#666;margin-bottom:6px}
    .stat-value{font-size:22px;font-weight:500}
    .stat-unit{font-size:13px;color:#888;margin-left:2px}

    .add-section{border-top:0.5px solid #ddd;padding-top:1rem}
    .add-section p{font-size:13px;color:#666;margin-bottom:6px}
    .add-form{display:flex;gap:8px;flex-wrap:wrap}
    .add-form input,.add-form select{padding:8px 12px;border:0.5px solid #ccc;border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a}
    .add-form input{flex:1;min-width:120px}
    .add-form select{width:110px}

    .log-list{display:flex;flex-direction:column;gap:8px}
    .log-item{background:#fff;border:0.5px solid #ddd;border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
    .log-left{display:flex;align-items:center;gap:10px}
    .log-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .log-name{font-size:14px;font-weight:500}
    .log-date{font-size:12px;color:#888}
    .empty-msg{font-size:14px;color:#888;text-align:center;padding:2rem 0}

    .chart-wrap{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1.25rem}
    .chart-title{font-size:14px;font-weight:500;margin-bottom:1rem}
    .bars{display:flex;align-items:flex-end;gap:8px;height:160px}
    .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
    .bar-fill{width:100%;border-radius:4px 4px 0 0;min-height:2px}
    .bar-label{font-size:11px;color:#888}
    .bar-val{font-size:11px;color:#888}
    .legend{display:flex;gap:12px;margin-top:1rem;flex-wrap:wrap}
    .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#888}
    .legend-dot{width:8px;height:8px;border-radius:50%}

    .bgm-section{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
    .bgm-title{font-size:14px;font-weight:500;margin-bottom:1rem;display:flex;align-items:center;gap:6px}
    .yt-input-row{display:flex;gap:8px;margin-bottom:1rem}
    .yt-input-row input{flex:1;padding:8px 12px;border:0.5px solid #ccc;border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a}
    .yt-note{font-size:12px;color:#bbb;line-height:1.6}
    .yt-open-btn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:8px 16px;background:#FF0000;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;text-decoration:none}
    
    /* music player */
    .mp-player{background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:14px;padding:1.25rem;color:#fff;margin-bottom:1rem}
    .mp-art{width:64px;height:64px;background:rgba(255,255,255,.1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px}
    .mp-track-name{font-size:15px;font-weight:500;text-align:center;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mp-pl-name{font-size:12px;color:rgba(255,255,255,.5);text-align:center;margin-bottom:12px}
    .mp-seek-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .mp-time{font-size:11px;color:rgba(255,255,255,.6);min-width:36px}
    .mp-seek{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.2);outline:none;cursor:pointer}
    .mp-seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer}
    .mp-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
    .mp-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:20px;padding:4px;border-radius:6px;display:flex;align-items:center;transition:color .15s}
    .mp-btn:hover{color:#fff}
    .mp-btn.on{color:#4facfe}
    .mp-play{background:#fff;color:#1a1a1a;border:none;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
    .mp-play:hover{opacity:.85}
    .mp-vol-row{display:flex;align-items:center;gap:8px}
    .mp-vol-icon{font-size:14px;color:rgba(255,255,255,.5)}
    .mp-vol{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.2);outline:none;cursor:pointer}
    .mp-vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer}
    
    /* playlist manager */
    .pl-manager{display:flex;flex-direction:column;gap:10px}
    .pl-manager-header{display:flex;align-items:center;justify-content:space-between}
    .pl-manager-title{font-size:14px;font-weight:500}
    .pl-list-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:4px}
    .pl-list-tab{font-size:13px;padding:5px 14px;border:0.5px solid #ddd;border-radius:20px;background:none;cursor:pointer;color:#888;white-space:nowrap;flex-shrink:0}
    .pl-list-tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
    .pl-card{background:#fff;border:0.5px solid #ddd;border-radius:12px;overflow:hidden}
    .pl-card-header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:0.5px solid #f0f0f0}
    .pl-card-name{font-size:14px;font-weight:500;flex:1}
    .pl-card-count{font-size:12px;color:#aaa}
    .pl-card-btn{background:none;border:none;cursor:pointer;color:#888;font-size:15px;padding:3px;display:flex;align-items:center}
    .pl-card-btn:hover{color:#1a1a1a}
    .pl-card-btn.danger:hover{color:#e74c3c}
    .pl-tracks{display:flex;flex-direction:column;max-height:220px;overflow-y:auto}
    .pl-track{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:0.5px solid #f8f8f8;cursor:pointer;transition:background .15s}
    .pl-track:last-child{border-bottom:none}
    .pl-track:hover{background:#f5f5f3}
    .pl-track.playing{background:#f0f6ff}
    .pl-track-num{font-size:12px;color:#aaa;min-width:18px;text-align:right}
    .pl-track.playing .pl-track-num{color:#185FA5;font-weight:700}
    .pl-track-name覆{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pl-track-dur{font-size:12px;color:#aaa}
    .pl-track-del{background:none;border:none;cursor:pointer;color:#ddd;font-size:13px;padding:2px;opacity:0;transition:opacity .15s}
    .pl-track:hover .pl-track-del{opacity:1}
    .pl-drop-zone{border:1.5px dashed #ddd;border-radius:8px;padding:1rem;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin:8px 14px}
    .pl-drop-zone:hover,.pl-drop-zone.drag-over{border-color:#185FA5;background:#f0f6ff}
    .pl-drop-zone p{font-size:13px;color:#aaa}
    .mp-empty{text-align:center;padding:2rem;color:#aaa;font-size:14px}
    
    /* PET */
    .pet-panel{display:flex;flex-direction:column;gap:1rem}
    .pet-stage{background:linear-gradient(135deg,#e8f4ff,#f0e8ff);border-radius:16px;padding:1.5rem;text-align:center;border:0.5px solid #ddd}
    .pet-name-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px}
    .pet-name{font-size:18px;font-weight:500}
    .pet-edit-btn{background:none;border:none;cursor:pointer;color:#aaa;font-size:16px}
    .rank-badge{font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;letter-spacing:.5px}
    .rank-R{background:#ddd;color:#555}
    .rank-SR{background:linear-gradient(90deg,#4facfe,#00f2fe);color:#fff}
    .rank-SSR{background:linear-gradient(90deg,#f7971e,#ffd200);color:#fff}
    .pet-level-badge{font-size:12px;background:#185FA5;color:#fff;border-radius:20px;padding:2px 10px}
    .pet-canvas-wrap{margin:1rem auto;width:160px;height:160px}
    .pet-canvas-wrap canvas{width:160px;height:160px}
    .xp-row{display:flex;align-items:center;gap:10px;margin-top:12px}
    .xp-label{font-size:12px;color:#888;white-space:nowrap}
    .xp-bar-bg{flex:1;height:10px;background:#ddd;border-radius:5px;overflow:hidden}
    .xp-bar-fill{height:100%;background:linear-gradient(90deg,#185FA5,#7c3aed);border-radius:5px;transition:width .5s ease}
    .xp-text{font-size:12px;color:#888;white-space:nowrap}

    .exp-section{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1.25rem}
    .exp-title{font-size:15px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:6px}
    .exp-rate{font-size:13px;color:#888;margin-bottom:12px}
    .exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
    .exp-item{border
